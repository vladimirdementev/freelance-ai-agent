spring:
  application:
    name: freelance-ai-agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/freelance_ai}
    username: ${DATABASE_USERNAME:freelance_ai}
    password: ${DATABASE_PASSWORD:freelance_ai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

freelance-ai:
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
  scoring:
    target-hourly-rate: ${TARGET_HOURLY_RATE:1500}
    min-notification-score: ${MIN_NOTIFICATION_SCORE:80}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  collectors:
    enabled: ${COLLECTORS_ENABLED:false}
    kwork-feed-url: ${KWORK_FEED_URL:}
    fl-ru-feed-url: ${FL_RU_FEED_URL:https://www.fl.ru/rss/all.xml}
    poll-interval-ms: ${COLLECTORS_POLL_INTERVAL_MS:1800000}
  workspaces:
    root-path: ${WORKSPACES_ROOT:workspaces}
